name: Playwright Tests
on:
  push:
    branches: [ main, master, lab3-staging ]
  pull_request:
    branches: [ main, master, lab3-staging ]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toktickit -d toktickit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit_test?schema=public
      SESSION_SECRET: ci-only-session-secret
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: |
        npm ci
        npm ci --prefix server
        npm ci --prefix client
    - name: Prepare test database
      working-directory: server
      run: |
        npx prisma generate
        npx prisma migrate deploy
        npm run prisma:seed
    - name: Build application
      run: |
        npm run build --prefix server
        npm run build --prefix client
    - name: Run frontend tests
      run: npm test --prefix client
    - name: Run backend tests
      run: npm test --prefix server
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
